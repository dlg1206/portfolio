<footer class="footer">
  <!-- icon row -->
  <div class="footer-icons">
    @for (icon of socialIcons; track icon.href) {
      <a
        class="footer-link"
        [href]="icon.href"
        target="_blank"
        rel="noopener noreferrer">
        <span class="icon-box">
          <i [class]="icon.icon" aria-hidden="true"></i>
        </span>
        <span class="footer-label">{{ icon.alt }}</span>
      </a>
    }
  </div>
  <p class="footer-text">© {{ currentYear }} Derek Garcia. All rights reserved.</p>
</footer>
