<!--Welcome banner-->
<app-hero></app-hero>
<!--use padding instead of margin so blue gradient fills page-->
<div class="blue-gradient">
  <div class="page-content-container">

    <!--About me row-->
    <div class="content-row" style="align-items: center; gap: 4.063rem; ">
      <div>
        <app-section-title [title]="'About Me'"></app-section-title>
        <p class="about-me-text">
          I am a passionate software security researcher dedicated to finding and answering interesting security
          problems. I love working with new technologies to find innovative solutions to address the ever present
          challenges with create a more secure software supply chain.
        </p>
        <app-simple-button [content]="'Learn More'" [routerLink]="'/about'" class="resume-btn"></app-simple-button>
      </div>

      <img [alt]="images.aboutMeGarcia.alt"
           [ngSrc]="images.aboutMeGarcia.image"
           width="277"
           height="351"
           class="avatar"
      />
    </div>

  </div>
</div>
