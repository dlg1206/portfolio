<!--Welcome banner-->
<app-hero></app-hero>
<!--use padding instead of margin so blue gradient fills page-->
<div class="page-content blue-gradient" style="padding-top: 5rem; padding-bottom: 3rem">

  <!--info tiles-->
  <div #infoRow class="hidden info-card-grid mb-5">
    @for (infoTile of infoTiles; track infoTile.title) {
      <app-info-tile
        [title]="infoTile.title"
        [icon]="infoTile.icon"
        [content]="infoTile.content"
        [routerLink]="infoTile.routerLink"
        [width]="infoTile.width ?? 60"
      ></app-info-tile>
    }
  </div>

  <!--Learn more section-->
  <div #learnMoreRow class="hidden flex-row align-center mb-5" style="gap: 5rem; min-width: 600px;">
    <!--Learn more excerpt-->
    <div style="width: 60%; min-width: 600px;">
      <h3 class="section-header mb-1">Want to Learn More?</h3>
      <!--todo expand with more text-->
      <p class="text-md justify-text">{{ HOME_CONTENT.learnMore }}</p>
    </div>
    <!--picture background-->
    <div class="group-background" style="min-width: 540px;">
      <!--picture-->
      <a [href]="imageCollection['cyberSymposium'].source" rel="noopener noreferrer" target="_blank">
        <img [alt]="imageCollection['cyberSymposium'].alt"
             [ngSrc]="imageCollection['cyberSymposium'].image"
             height="360"
             style="margin-bottom: 0.5rem"
             width="540"
        />
      </a>
      <p class="group-text">RIT Alum at the UH Cybersecurity Symposium</p>
    </div>
  </div>
</div>
