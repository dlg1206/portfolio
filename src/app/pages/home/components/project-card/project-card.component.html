<div class="card">
  <div class="banner-container">
    @if (!failed()) {
      <img [ngSrc]="src()" [alt]="alt()" width="1200" height="600" (error)="failed.set(true)"/>
    } @else {
      <img [ngSrc]="'/img/fallback-project-banner.png'" [alt]="'Default project banner'" width="1200" height="630"/>
    }
  </div>
  <div class="content-container">
    <div class="keywords">
      @for (k of sortedKeywords(); track k) {
        <app-keyword-chip [content]="k"/>
      }
    </div>
    <p class="abstract">{{ project().abstract }}</p>
    <app-simple-button [content]="'Learn More'" [routerLink]="href()" [padding]="'lg'"
                       class="learn-more"></app-simple-button>
  </div>
</div>
