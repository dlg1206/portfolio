<div class="employment-card">
  <!--company logo-->
  <div class="logo-container">
    <img
      [alt]="data().company.logo.alt"
      [ngSrc]="data().company.logo.src"
      width="50"
      height="50"
    />
  </div>

  <!--details-->
  <div class="text-container">
    <p style="font-weight: bold;">{{ period() }}</p>
    <div class="position">
      <p>{{ data().headline.title }}</p>
    </div>
    <p>{{ data().company.name }}</p>
  </div>
</div>
