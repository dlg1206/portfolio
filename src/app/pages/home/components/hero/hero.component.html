<!--background image-->
<div [ngStyle]="{'background-image': 'url(' + images.banner.image + ')' }" class="full-cover">
  <!--overlay-->
  <div class="hero-container">

    <img
      [alt]="images.hero.alt"
      [ngSrc]="images.hero.image"
      width="404"
      height="600"
    />

    <!--welcome-->
    <div class="flex-column justify-center" style="margin-left: 5rem">
      <!--greeting-->
      <h1 #heroTitle class="hero-title hidden" [class.visible]="heroVisible()">
        Hello there 👋
        <br>
        <span class="no-break">I'm <span style="color: var(--orange-accent)">Derek Garcia</span></span>
      </h1>
      <h2 #heroSubtitle class="hero-subtitle mb-1 hidden" [class.visible]="heroVisible()">
        Researcher and <span class="no-break">Software Developer</span>
      </h2>

      <!--icon row-->
      <div class="flex-row" style="gap: 1.5rem;">
        @for (icon of socialIcons; track icon.href; let i = $index) {
          <a
            class="social-icon hidden"
            [class.visible]="socialIconsVisible()"
            [style.transition-delay.s]="(i * 0.1) + 1.25"
            [href]="icon.href"
            [attr.aria-label]="icon.alt"
            target="_blank"
            rel="noopener noreferrer">
            <span class="icon-box">
              <i [class]="icon.icon" aria-hidden="true"></i>
            </span>
          </a>
        }
      </div>

    </div>
  </div>
</div>
