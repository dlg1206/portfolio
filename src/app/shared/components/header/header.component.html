<nav [class.no-border]="isHomePage()" class="header">
  <!-- Left side -->
  <a class="name no-style no-break" routerLink="/">Derek Garcia</a>

  <!-- Right side menu items -->
  <div class="nav-right">
    <!--page nav-->
    <ul class="menu-items">

      <!--nav links-->
      @for (item of items; track item.label) {
        <li>
          <a [routerLink]="item.routerLink" class="menu-item">{{ item.label }}</a>
        </li>
      }

      <!--resume button-->
      <li>
        <app-simple-button [content]="'Resume'" [routerLink]="'/'"></app-simple-button>
      </li>
    </ul>
  </div>
</nav>
